<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMPASS 英語長文トレーニング</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: sans-serif; 
      height: 100dvh; 
      display: flex; 
      flex-direction: column; 
      background: #fdfdfd; 
      color: #333; 
      overflow: hidden; 
      overscroll-behavior-y: none;
    }
    .screen { display: none; flex-direction: column; flex: 1; height: 100%; overflow: hidden; }
    .screen.active { display: flex; }

    /* ログイン画面 */
    #screen-login { justify-content: center; align-items: center; background: #2c3e50; }
    .login-box { background: #fff; padding: 30px 20px; border-radius: 14px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .login-title { font-size: 22px; color: #2c3e50; font-weight: bold; margin-bottom: 18px; line-height: 1.4; }
    .login-input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 10px; margin-bottom: 12px; text-align: center; outline: none; }
    .login-input:focus { border-color: #3498db; }
    .login-btn { width: 100%; padding: 15px; background: #3498db; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .login-error { display: none; margin-bottom: 12px; padding: 10px; border-radius: 8px; background: #fdf0ef; border: 1px solid #f5c6cb; color: #c0392b; font-size: 13px; font-weight: bold; }

    /* モード選択画面 */
    #screen-mode { justify-content: center; align-items: center; background: #34495e; padding: 20px; }
    .mode-container { width: 100%; max-width: 400px; text-align: center; }
    .mode-user-bar { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.16); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: bold; margin-bottom: 16px; cursor: pointer; }
    .mode-heading { color: #fff; font-size: 20px; margin-bottom: 22px; font-weight: bold; }
    .mode-card { background: #fff; padding: 22px; border-radius: 14px; margin-bottom: 15px; cursor: pointer; text-align: left; }
    .mode-card.basic { border-left: 6px solid #27ae60; }
    .mode-card.advanced { border-left: 6px solid #e74c3c; }
    .mode-title { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
    .mode-desc { font-size: 13px; color: #7f8c8d; line-height: 1.4; }
    
    /* テーマ選択画面 */
    .header-basic { flex-shrink: 0; background: #2d3436; color: #fff; padding: 14px 16px; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .header-left-group { display: flex; align-items: center; gap: 8px; }
    .back-to-mode-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .user-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    
    #theme-list-container { padding: 20px; overflow-y: auto; flex: 1; overscroll-behavior-y: contain; }
    
    .theme-item { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid #27ae60; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .theme-item.advanced-item { border-left-color: #e74c3c; }
    .theme-info { flex: 1; }
    .theme-level { font-size: 13px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
    .theme-name { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .theme-arrow { color: #3498db; font-weight: bold; font-size: 16px; }
    
    /* プレイ画面 */
    header { flex-shrink: 0; background: #2d3436; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; gap: 8px; }
    .back-to-select-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    
    #main-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    
    /* 採点後の大画面切り替えタブ */
    .review-tabs { display: none; flex-direction: row; background: #2d3436; flex-shrink: 0; }
    .review-tab { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; background: #2d3436; color: #b2bec3; cursor: pointer; transition: 0.2s; }
    .review-tab.active { background: #3498db; color: #fff; border-bottom: 4px solid #2980b9; }

    .trans-tabs { display: none; flex-direction: row; background: #fff; border-bottom: 2px solid #00b894; flex-shrink: 0; }
    .trans-tab { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; background: #f4f7f6; color: #7f8c8d; cursor: pointer; transition: 0.2s; }
    .trans-tab.active { background: #00b894; color: #fff; }
    
    #passage-area { flex: none; min-height: 30%; max-height: 50%; padding: 25px 20px; background: #fff; border-bottom: 3px solid #e0e0e0; overflow-y: auto; font-size: 16px; line-height: 1.8; overscroll-behavior-y: contain; }
    #question-area { flex: 1; padding: 20px; background: #f4f7f6; overflow-y: auto; overscroll-behavior-y: contain; }
    
    /* 大画面モード用のクラス */
    .full-mode { flex: 1 !important; max-height: none !important; min-height: none !important; }
    
    .question-card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #3498db; }
    .question-title { font-weight: bold; margin-bottom: 12px; color: #2980b9; font-size: 14px; }
    .question-text { font-size: 16px; margin-bottom: 15px; line-height: 1.5; }
    .tf-buttons { display: flex; gap: 12px; }
    .tf-btn { flex: 1; padding: 14px; border: 2px solid #bdc3c7; background: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; color: #7f8c8d; text-align: center; cursor: pointer; }
    .tf-btn.active { border-color: #3498db; background: #ebf5fb; color: #2980b9; }
    .extract-input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 8px; outline: none; }
    .action-btn-container { margin-top: 10px; margin-bottom: 40px; }
    .submit-btn { width: 100%; padding: 16px; background: #00b894; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
    .return-btn { width: 100%; padding: 16px; background: #27ae60; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 12px; cursor: pointer; display: none; }
    .feedback-area { display: none; margin-top: 15px; padding: 15px; background: #fdf5f6; border: 1px solid #fadbd8; border-radius: 8px; color: #c0392b; font-size: 15px; line-height: 1.6; }
    .feedback-area.correct { background: #e8f8f5; border-color: #d1f2eb; color: #16a085; }
    .locked { pointer-events: none; opacity: 0.8; }

    /* 画面内通知トースト（alert不使用） */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      z-index: 1000;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .toast-msg.show { display: block; }
  </style>
</head>
<body>
  <!-- ログイン画面 -->
  <div id="screen-login" class="screen active">
    <div class="login-box">
      <div class="login-title">COMPASS<br>英語長文トレーニング</div>
      <input type="text" id="student-id" class="login-input" inputmode="numeric" placeholder="生徒ID（例：1001）">
      <input type="text" id="student-name" class="login-input" placeholder="氏名（例：山田 太郎）">
      <div id="login-error" class="login-error"></div>
      <button class="login-btn" onclick="startLoginApp()">ログインして次へ</button>
    </div>
  </div>

  <!-- モード選択画面 -->
  <div id="screen-mode" class="screen">
    <div class="mode-container">
      <div class="mode-user-bar" id="mode-user-badge" onclick="openLoginScreen()" title="タップしてID・名前を変更">👤 未登録</div>
      <div class="mode-heading">学習モードを選んでください</div>
      <div class="mode-card basic" onclick="chooseAppMode('basic')">
        <div class="mode-title">🌱 基礎スモールステップ編</div>
        <div class="mode-desc">基本の3問で着実に理解！苦手な生徒も安心して成功体験を積めるモード。</div>
      </div>
      <div class="mode-card advanced" onclick="chooseAppMode('advanced')">
        <div class="mode-title">🔥 受験対策・発展編</div>
        <div class="mode-desc">公立高校入試レベルの歯ごたえある長文・設問に挑戦するハイレベルモード。</div>
      </div>
    </div>
  </div>

  <!-- テーマ選択画面 -->
  <div id="screen-select" class="screen">
    <div class="header-basic">
      <div class="header-left-group">
        <button class="back-to-mode-btn" onclick="changeAppScreen('screen-mode')">◀ モード変更</button>
        <span id="header-mode-title" style="font-size:13px;">基礎編</span>
      </div>
      <span class="user-badge" id="display-user-name" onclick="openLoginScreen()" title="タップしてID・名前を変更">生徒名</span>
    </div>
    <div id="theme-list-container">
      <div style="text-align:center; margin-top:40px; color:#7f8c8d;">データを読み込み中...<br>少しお待ちください</div>
    </div>
  </div>

  <!-- プレイ画面 -->
  <div id="screen-play" class="screen">
    <header>
      <button class="back-to-select-btn" onclick="changeAppScreen('screen-select')">◀ テーマ一覧へ</button>
      <span id="play-header-theme">テーマ名</span>
    </header>
    <div id="main-container">
      <!-- 採点後に登場する、復習用の大画面切り替えタブ -->
      <div id="review-tabs" class="review-tabs">
        <button id="tab-review-qa" class="review-tab active" onclick="switchReviewTab('qa')">📝 採点結果・解説</button>
        <button id="tab-review-passage" class="review-tab" onclick="switchReviewTab('passage')">📖 長文・和訳</button>
      </div>

      <!-- 英語⇔日本語の切り替えタブ -->
      <div id="trans-tabs" class="trans-tabs">
        <button id="tab-eng" class="trans-tab active" onclick="switchLang('eng')">🇺🇸 英語長文</button>
        <button id="tab-jap" class="trans-tab" onclick="switchLang('jap')">🇯🇵 日本語訳</button>
      </div>
      
      <div id="passage-area"></div>
      
      <div id="question-area">
        <div id="dynamic-questions"></div>
        <div class="action-btn-container">
          <button id="submit-btn" class="submit-btn" onclick="gradeAppAnswers()">採点して結果を見る</button>
          <button id="return-btn" class="return-btn" onclick="changeAppScreen('screen-select')">📚 別の問題を選ぶ</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通知トースト -->
  <div id="toast-msg" class="toast-msg"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw5Pzvk8iz8V-C4wD-srpmJ4yNwlgkBMDdRiIm9P3uTVs3BgbnGrX8cifHe3B4AMKd7lA/exec";
    const STORAGE_ID_KEY = "compass_reading_student_id";
    const STORAGE_NAME_KEY = "compass_reading_student_name";

    let studentId = "";
    let studentRawName = "";
    let studentName = ""; // 表示・GAS送信用（例: "ID:1001 山田 太郎"）
    let isAutoLinked = false;
    let currentMode = "basic";
    let allThemesData = [];
    let currentThemeData = null;
    let toastTimer = null;

    function showToast(msg) {
      const el = document.getElementById('toast-msg');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        el.classList.remove('show');
      }, 2600);
    }

    function buildStudentDisplayLabel(idVal, nameVal) {
      if (idVal && nameVal) return "ID:" + idVal + " " + nameVal;
      if (idVal) return "ID:" + idVal;
      if (nameVal) return nameVal;
      return "未登録";
    }

    function updateUserBadges() {
      const prefix = isAutoLinked ? "🔗 " : "👤 ";
      const label = prefix + studentName;
      const modeBadge = document.getElementById('mode-user-badge');
      const selectBadge = document.getElementById('display-user-name');
      if (modeBadge) modeBadge.innerText = label;
      if (selectBadge) selectBadge.innerText = label;
    }

    window.openLoginScreen = function() {
      document.getElementById('student-id').value = studentId;
      document.getElementById('student-name').value = studentRawName;
      document.getElementById('login-error').style.display = 'none';
      changeAppScreen('screen-login');
    };

    // 起動時にURLパラメータ（?studentId=...&studentName=...）および保存済み情報を読み込み
    window.addEventListener('DOMContentLoaded', function() {
      let urlId = "";
      let urlName = "";
      try {
        const params = new URLSearchParams(window.location.search);
        urlId = (params.get('studentId') || '').trim();
        urlName = (params.get('studentName') || '').trim();
      } catch (e) {}

      let savedId = "";
      let savedName = "";
      try {
        savedId = (localStorage.getItem(STORAGE_ID_KEY) || '').trim();
        savedName = (localStorage.getItem(STORAGE_NAME_KEY) || '').trim();
      } catch (e) {}

      studentId = urlId || savedId;
      studentRawName = urlName || savedName;
      isAutoLinked = !!(urlId || urlName);

      document.getElementById('student-id').value = studentId;
      document.getElementById('student-name').value = studentRawName;

      if (urlId || urlName) {
        try {
          if (studentId) localStorage.setItem(STORAGE_ID_KEY, studentId);
          if (studentRawName) localStorage.setItem(STORAGE_NAME_KEY, studentRawName);
        } catch (e) {}
        studentName = buildStudentDisplayLabel(studentId, studentRawName);
        updateUserBadges();
        // 勉強管理アプリから起動された場合はログイン画面をスキップしてモード選択へ
        changeAppScreen('screen-mode');
        if (allThemesData.length === 0) fetchAppGASData();
      }
    });

    window.startLoginApp = function() {
      const idVal = document.getElementById('student-id').value.trim();
      const nameVal = document.getElementById('student-name').value.trim();
      const errEl = document.getElementById('login-error');

      if (!idVal && !nameVal) {
        errEl.textContent = "生徒IDまたは氏名を入力してください。";
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      studentId = idVal;
      studentRawName = nameVal;
      isAutoLinked = false;
      studentName = buildStudentDisplayLabel(studentId, studentRawName);

      try {
        localStorage.setItem(STORAGE_ID_KEY, studentId);
        localStorage.setItem(STORAGE_NAME_KEY, studentRawName);
      } catch (e) {}

      updateUserBadges();
      changeAppScreen('screen-mode');
      if (allThemesData.length === 0) fetchAppGASData();
    };

    window.chooseAppMode = function(mode) {
      currentMode = mode;
      document.getElementById('header-mode-title').innerText = (mode === 'basic') ? "基礎スモールステップ編" : "受験対策・発展編";
      renderAppThemeList();
      changeAppScreen('screen-select');
    };

    window.fetchAppGASData = function() {
      fetch(GAS_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) { 
          allThemesData = data; 
          renderAppThemeList();
        })
        .catch(function(e) {
          document.getElementById('theme-list-container').innerHTML = '<div style="text-align:center; color:red; margin-top:20px;">読込エラーが発生しました。</div>';
        });
    };

    window.renderAppThemeList = function() {
      const container = document.getElementById('theme-list-container');
      if (allThemesData.length === 0) {
        container.innerHTML = '<div style="text-align:center; margin-top:40px; color:#7f8c8d;">データを読み込み中...<br>少しお待ちください</div>';
        return;
      }
      container.innerHTML = ""; 
      const filteredThemes = allThemesData.filter(function(theme) {
        const lvl = String(theme.level || "");
        const isAdv = (lvl.indexOf("受験") !== -1 || lvl.indexOf("発展") !== -1 || lvl.indexOf("難関") !== -1);
        return (currentMode === 'advanced') ? isAdv : !isAdv;
      });
      if (filteredThemes.length === 0) {
        container.innerHTML = '<div style="text-align:center; margin-top:40px; color:#7f8c8d;">このモードのデータがありません。</div>';
        return;
      }
      filteredThemes.forEach(function(theme) {
        const realIndex = allThemesData.indexOf(theme);
        const itemClass = (currentMode === 'advanced') ? 'theme-item advanced-item' : 'theme-item';
        let itemHtml = '<div class="' + itemClass + '" onclick="startAppTheme(' + realIndex + ')">';
        itemHtml += '<div class="theme-info"><div class="theme-level">レベル: ' + theme.level + '</div>';
        itemHtml += '<div class="theme-name">' + theme.theme + '</div></div>';
        itemHtml += '<div class="theme-arrow">挑戦する ▶</div></div>';
        container.innerHTML += itemHtml;
      });
    };

    window.startAppTheme = function(index) {
      currentThemeData = allThemesData[index];
      document.getElementById('play-header-theme').innerText = currentThemeData.theme + ' (' + currentThemeData.level + ')';
      
      document.getElementById('review-tabs').style.display = 'none';
      document.getElementById('trans-tabs').style.display = 'none';
      
      const passageArea = document.getElementById('passage-area');
      const questionArea = document.getElementById('question-area');
      
      passageArea.style.display = '';
      passageArea.classList.remove('full-mode');
      questionArea.style.display = '';
      questionArea.classList.remove('full-mode');
      
      switchLang('eng');
      
      const qContainer = document.getElementById('dynamic-questions');
      let questionsHtml = "";
      
      let qNum = 1;
      while (currentThemeData['q' + qNum]) {
        questionsHtml += buildAppQuestionHTML(qNum, currentThemeData['q' + qNum]);
        qNum++;
      }
      
      qContainer.innerHTML = questionsHtml;

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "採点して結果を見る"; 
      submitBtn.style.backgroundColor = "#00b894"; 
      submitBtn.disabled = false; 
      submitBtn.style.display = "block";
      
      document.getElementById('return-btn').style.display = "none"; 
      passageArea.scrollTop = 0; 
      questionArea.scrollTop = 0;
      
      changeAppScreen('screen-play');
    };

    window.switchLang = function(lang) {
      const tabEng = document.getElementById('tab-eng');
      const tabJap = document.getElementById('tab-jap');
      const passageArea = document.getElementById('passage-area');
      
      if (lang === 'eng') {
        tabEng.classList.add('active');
        tabJap.classList.remove('active');
        passageArea.innerHTML = '<p>' + currentThemeData.passage_en.replace(/\n/g, '<br>') + '</p>';
      } else {
        tabJap.classList.add('active');
        tabEng.classList.remove('active');
        let japText = currentThemeData.passage_ja ? currentThemeData.passage_ja.replace(/\n/g, '<br>') : 'このテーマには日本語訳がまだ登録されていません。';
        passageArea.innerHTML = '<p style="color: #27ae60; font-weight: bold; margin-bottom: 10px;">💡 日本語訳</p><p>' + japText + '</p>';
      }
      passageArea.scrollTop = 0; 
    };

    window.switchReviewTab = function(mode) {
      const tabQa = document.getElementById('tab-review-qa');
      const tabPassage = document.getElementById('tab-review-passage');
      const passageArea = document.getElementById('passage-area');
      const questionArea = document.getElementById('question-area');
      const transTabs = document.getElementById('trans-tabs');
      
      if (mode === 'qa') {
        tabQa.classList.add('active');
        tabPassage.classList.remove('active');
        
        passageArea.style.display = 'none';
        if (transTabs) transTabs.style.display = 'none';
        
        questionArea.style.display = 'block';
        questionArea.classList.add('full-mode');
      } else {
        tabPassage.classList.add('active');
        tabQa.classList.remove('active');
        
        questionArea.style.display = 'none';
        
        passageArea.style.display = 'block';
        passageArea.classList.add('full-mode');
        
        if (currentThemeData.passage_ja) {
          transTabs.style.display = 'flex';
        }
      }
    };

    window.buildAppQuestionHTML = function(qNum, qData) {
      let html = '<div class="question-card" id="q' + qNum + '-card">';
      html += '<div class="question-title">問' + qNum + ' ' + (qData.type === 'TF' ? '(True or False)' : '(抜き出し)') + '</div>';
      html += '<div class="question-text">' + qData.question + '</div>';
      if (qData.type === 'TF') {
        html += '<div class="tf-buttons">';
        html += '<div class="tf-btn" onclick="selectAppTf(\'q' + qNum + '\', \'True\', this)">True (正)</div>';
        html += '<div class="tf-btn" onclick="selectAppTf(\'q' + qNum + '\', \'False\', this)">False (誤)</div>';
        html += '</div>';
        html += '<input type="hidden" id="q' + qNum + '-ans-hidden" value="">';
      } else {
        html += '<input type="text" id="q' + qNum + '-ans-input" class="extract-input" placeholder="英単語を入力" oninput="document.getElementById(\'q' + qNum + '-ans-hidden\').value = this.value">';
        html += '<input type="hidden" id="q' + qNum + '-ans-hidden" value="">';
      }
      html += '<div class="feedback-area" id="q' + qNum + '-feedback"></div></div>';
      return html;
    };

    window.selectAppTf = function(qId, value, btnEl) {
      if (document.getElementById(qId + '-card').classList.contains('locked')) return;
      document.getElementById(qId + '-ans-hidden').value = value;
      const btns = document.getElementById(qId + '-card').querySelectorAll('.tf-btn');
      for (let i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btnEl) btnEl.classList.add('active');
    };

    window.gradeAppAnswers = function() {
      let score = 0;
      let missedList = [];
      
      let totalQuestions = 0;
      while (currentThemeData['q' + (totalQuestions + 1)]) {
        totalQuestions++;
      }

      // 先に未回答チェックを行う
      for (let i = 1; i <= totalQuestions; i++) {
        let userAnswer = document.getElementById('q' + i + '-ans-hidden').value.trim();
        if (userAnswer === "") {
          showToast('⚠️ 問' + i + ' がまだ解かれていません！');
          return;
        }
      }

      for (let i = 1; i <= totalQuestions; i++) {
        let qId = 'q' + i;
        let qData = currentThemeData[qId];
        let userAnswer = document.getElementById(qId + '-ans-hidden').value.trim().toLowerCase();
        let correctAnswer = String(qData.answer).toLowerCase();
        let feedbackEl = document.getElementById(qId + '-feedback');
        
        if (userAnswer === correctAnswer) {
          score++;
          feedbackEl.innerHTML = '<strong>⭕ 正解！</strong><br>' + qData.exp;
          feedbackEl.classList.add('correct');
        } else {
          missedList.push('問' + i);
          feedbackEl.innerHTML = '<strong>❌ 違うよ！</strong> (正解: ' + qData.answer + ')<br>' + qData.exp;
          feedbackEl.classList.remove('correct');
        }
        feedbackEl.style.display = 'block';
        document.getElementById(qId + '-card').classList.add('locked');
      }

      document.getElementById('review-tabs').style.display = 'flex';
      switchReviewTab('qa');
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.innerText = "採点＆成績を記録中...";
      submitBtn.style.backgroundColor = "#f39c12";
      submitBtn.disabled = true;
      
      let finalThemeName = currentThemeData.theme + (currentMode === 'advanced' ? ' [受験・発展]' : ' [基礎]');
      let missedStr = missedList.length > 0 ? missedList.join(", ") : "パーフェクト！";
      
      fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          studentId: studentId,
          studentRawName: studentRawName,
          studentName: studentName,
          theme: finalThemeName,
          level: currentThemeData.level,
          score: score,
          missedQuestions: missedStr
        })
      }).then(function(res) { return res.json(); }).then(function(result) {
        submitBtn.innerText = "得点: " + score + " / " + totalQuestions + " 問正解 (記録完了！)";
        submitBtn.style.backgroundColor = '#27ae60';
        document.getElementById('return-btn').style.display = "block";
      }).catch(function(e) {
        submitBtn.innerText = "得点: " + score + " / " + totalQuestions + " 問正解 (記録エラー)";
        submitBtn.style.backgroundColor = '#e74c3c';
        document.getElementById('return-btn').style.display = "block";
      });
    };

    window.changeAppScreen = function(screenId) {
      const screens = document.querySelectorAll('.screen');
      for (let i = 0; i < screens.length; i++) screens[i].classList.remove('active');
      document.getElementById(screenId).classList.add('active');
    };
  </script>
</body>
</html>
